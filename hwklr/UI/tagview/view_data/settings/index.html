<section class="tag-page tag-settings" id="settings-page">
  <div class="hero">
    <div>
      <h1>设置</h1>
      <p>账号、密码与 AI 配置统一在这里管理；所有功能标签页不再显示登录窗口。</p>
    </div>
    <div class="hero-badge">本机配置</div>
  </div>

  <div class="settings-layout">
    <section class="card settings-main">
      <div class="card-head">
        <h2>功能设置</h2>
        <button id="settings-save" class="btn primary" type="button">保存设置</button>
      </div>
      <p class="hint" id="settings-status">修改字段后失焦或切换开关会自动保存；深黄色标记的高级设置会先弹出确认。设置只保存在本机 config.json，不会上传到第三方。</p>
      <div id="settings-groups" class="settings-groups">
        <p class="muted">正在读取设置…</p>
      </div>
    </section>

    <aside class="card settings-side">
      <h2>运行信息</h2>
      <div class="info-list">
        <div class="info-item">
          <span class="info-label">软件版本</span>
          <span class="info-value mono" id="settings-version">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">本地监听端口</span>
          <span class="info-value mono" id="settings-port">—</span>
        </div>
        <div class="info-item">
          <span class="info-label">配置文件</span>
          <span class="info-value mono">config.json</span>
        </div>
      </div>

      <h3 class="section-title">知识库</h3>
      <div class="table-wrap compact">
        <table class="data-table">
          <thead>
            <tr>
              <th>功能</th>
              <th>版本</th>
              <th>题量</th>
            </tr>
          </thead>
          <tbody id="settings-bank-body">
            <tr>
              <td colspan="3" class="table-empty">正在读取知识库…</td>
            </tr>
          </tbody>
        </table>
      </div>
      <p class="hint">知识库文件位于 hwklr/runtime_data/，命名格式为“功能_bank_v版本.json”。</p>
    </aside>
  </div>
</section>
