<section class="tag-page tag-hsr" id="hsr-page">
  <div class="hero">
    <div>
      <h1>高铁纵横</h1>
      <p>登录高铁答题系统，自动匹配内置题库，并按选项原文作答，尽量降低选项顺序变化带来的影响。</p>
    </div>
    <div class="hero-badge">题库自动匹配</div>
  </div>

  <section class="card list-card">
    <div class="card-head hsr-toolbar">
      <h2>我的考试</h2>
      <div class="row">
        <span id="hsr-account-status" class="pill info">正在读取账号…</span>
        <button id="hsr-relogin" class="btn ghost small" type="button">重新登录</button>
        <button id="hsr-refresh" class="btn ghost small" type="button">刷新列表</button>
        <button id="hsr-goto-settings" class="btn ghost small" type="button">账号设置</button>
      </div>
    </div>
    <div class="table-wrap">
      <table class="data-table">
        <thead>
          <tr>
            <th>#</th>
            <th>章节</th>
            <th>已用 / 总</th>
            <th>最高分</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody id="hsr-exam-body">
          <tr>
            <td colspan="6" class="table-empty">正在读取账号状态…</td>
          </tr>
        </tbody>
      </table>
    </div>
    <p class="hint" id="hsr-list-hint">账号密码请在设置中填写。开始考试会消耗一次作答机会，请确认后再操作。</p>
  </section>

  <div class="modal-backdrop hidden" id="hsr-result-modal" role="dialog"
       aria-modal="true" aria-labelledby="hsr-result-title">
    <div class="modal result-modal">
      <div class="card-head">
        <h2 id="hsr-result-title">答题结果</h2>
        <button class="btn ghost small" id="hsr-result-close" type="button">关闭</button>
      </div>
      <div class="result-modal-body">
        <div id="hsr-result-summary" class="result-summary"></div>
        <div id="hsr-result-details" class="result-details"></div>
      </div>
    </div>
  </div>

  <div class="modal-backdrop hidden" id="hsr-confirm-modal" role="dialog"
       aria-modal="true" aria-labelledby="hsr-confirm-title">
    <div class="modal">
      <h3 id="hsr-confirm-title">确认开始考试</h3>
      <p id="hsr-confirm-text">即将开始考试，请确认。</p>
      <div class="row end">
        <button class="btn ghost" id="hsr-confirm-cancel" type="button">取消</button>
        <button class="btn danger" id="hsr-confirm-ok" type="button">确认开始</button>
      </div>
    </div>
  </div>
</section>
